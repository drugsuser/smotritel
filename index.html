<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Смотритель</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="overlay"><h1>СМОТРИТЕЛЬ</h1>
<div id="menu" class="panel"><button class="btn" id="play">ИГРАТЬ</button><button class="btn" id="openSettings">НАСТРОЙКИ</button></div>
<div id="settings" class="panel" hidden><h2>НАСТРОЙКИ</h2>
<div class="row"><div class="lbl"><span>Чувствительность мыши</span><span id="sensVal">1.00</span></div><input type="range" id="sens" min="0.1" max="3" step="0.05"></div>
<div class="row"><div class="lbl"><span>Громкость</span><span id="volVal">80%</span></div><input type="range" id="vol" min="0" max="1.5" step="0.05"></div>
<div class="row"><div class="lbl"><span>[debug] Скорость</span><span id="speedVal"></span></div><input type="range" id="speed" min="0.8" max="3.5" step="0.05"></div>
<div class="row"><div class="lbl"><span>[debug] Шагов/сек</span><span id="stepsVal"></span></div><input type="range" id="steps" min="0.8" max="2.5" step="0.05"></div>
<label class="row chk"><span>Показывать FPS</span><input type="checkbox" id="fps"></label>
<button class="btn" id="back">НАЗАД</button></div>
<div class="hint">WASD — ходить · мышь — смотреть · E — взять · F / ЛКМ — использовать · 1–5 — слоты · Esc — пауза</div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
